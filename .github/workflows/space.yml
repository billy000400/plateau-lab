# Pushes the backend to a Hugging Face Docker Space. Requires the repository
# variable HF_SPACE (e.g. lmjantsch/plateau-lab) and the secret HF_TOKEN (write access).
# Set NDIF_API_KEY and PLATEAU_ALLOWED_ORIGINS as secrets/variables in the Space itself.
name: Deploy backend
on:
  push:
    branches: [main]
    paths: [plateau/**, server/**, Dockerfile, requirements.txt, .github/workflows/space.yml]
  workflow_dispatch:
jobs:
  deploy:
    if: vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Space
        run: |
          mkdir space
          cp -r plateau server Dockerfile requirements.txt space/
          printf -- '---\ntitle: Plateau Lab API\nsdk: docker\napp_port: 7860\n---\nBackend for Plateau Lab. Source: https://github.com/${{ github.repository }}\n' > space/README.md
      - name: Upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub
          python -c "from huggingface_hub import upload_folder; upload_folder(repo_id='${{ vars.HF_SPACE }}', repo_type='space', folder_path='space', delete_patterns=['*'], commit_message='Deploy ${{ github.sha }}')"
