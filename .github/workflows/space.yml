# Pushes the app (API + web/ frontend) to a Hugging Face Gradio Space, whose SDK runs
# deploy/hf-space/app.py (uvicorn on port 7860; Gradio itself is unused). Requires the
# repository variable HF_SPACE (e.g. lmjantsch/plateau-lab) and the secret HF_TOKEN
# (write access). In the Space itself, set the secret HF_TOKEN (read access, with the
# Llama/Gemma licenses accepted) for gated tokenizers, and optionally
# PLATEAU_SHARED_NDIF_KEY + PLATEAU_ACCESS_CODE. Users bring their own NDIF keys.
name: Deploy
on:
  push:
    branches: [main]
    paths: [plateau/**, server/**, web/**, deploy/hf-space/**, requirements.txt, .github/workflows/space.yml]
  workflow_dispatch:
jobs:
  deploy:
    if: vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Space
        run: |
          mkdir space
          cp -r plateau server web space/
          cp deploy/hf-space/app.py space/
          # CPU-only torch wheel: inference runs on NDIF.
          { echo "--extra-index-url https://download.pytorch.org/whl/cpu"; cat requirements.txt; } > space/requirements.txt
          # ZeroGPU hardware only accepts listed torch versions (newest: 2.13.0); the server uses torch on CPU only.
          sed -i 's/^torch==.*/torch==2.13.0/' space/requirements.txt
          printf -- '---\ntitle: Plateau Lab\nsdk: gradio\nsdk_version: 6.28.0\npython_version: "3.12"\napp_file: app.py\npinned: false\n---\nActivation-plateau explorer on NDIF. Source: https://github.com/${{ github.repository }}\n' > space/README.md
      - name: Upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub
          python -c "from huggingface_hub import upload_folder; upload_folder(repo_id='${{ vars.HF_SPACE }}', repo_type='space', folder_path='space', delete_patterns=['*'], commit_message='Deploy ${{ github.sha }}')"
