# Pushes the app (API + web/ frontend) to a Hugging Face Docker Space. Requires the
# repository variable HF_SPACE (e.g. lmjantsch/plateau-lab) and the secret HF_TOKEN
# (write access). In the Space itself, set the secret HF_TOKEN (read access, with the
# Llama/Gemma licenses accepted) for gated tokenizers. Users bring their own NDIF keys.
name: Deploy
on:
  push:
    branches: [main]
    paths: [plateau/**, server/**, web/**, Dockerfile, requirements.txt, .github/workflows/space.yml]
  workflow_dispatch:
jobs:
  deploy:
    if: vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Space
        run: |
          mkdir space
          cp -r plateau server web Dockerfile requirements.txt space/
          printf -- '---\ntitle: Plateau Lab\nsdk: docker\napp_port: 7860\n---\nActivation-plateau explorer on NDIF. Source: https://github.com/${{ github.repository }}\n' > space/README.md
      - name: Upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub
          python -c "from huggingface_hub import upload_folder; upload_folder(repo_id='${{ vars.HF_SPACE }}', repo_type='space', folder_path='space', delete_patterns=['*'], commit_message='Deploy ${{ github.sha }}')"
