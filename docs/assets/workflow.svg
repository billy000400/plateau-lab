<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="476" viewBox="0 0 1200 476" role="img" aria-labelledby="title desc"><title id="title">Plateau Lab: compare, intervene, measure</title><desc id="desc">A and B prompts provide hidden states. Interpolate selected token states at a chosen block, run the remaining model, and measure c(t) and d(t) at residual layers and logits. The illustrated path is schematic.</desc><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"><rect width="1200" height="476" rx="24" fill="#242330"/><path d="M1042 0h158v174" fill="#302b45"/><text x="42" y="47" font-size="13" fill="#b7a4ee" font-weight="600" letter-spacing="2">MARS V  /  ACTIVATION EXPLORER</text><text x="42" y="104" font-size="36" fill="#ffffff" font-weight="600" >Two prompts. One hidden-state path.</text><text x="42" y="139" font-size="19" fill="#c5c2d2" font-weight="400" >Compare how a model’s internal representations move as you interpolate.</text><rect x="42" y="180" width="340" height="230" rx="16" fill="#32313f" stroke="#484556"/><text x="62" y="215" font-size="13" fill="#b8a2f5" font-weight="600" >01</text><text x="97" y="215" font-size="13" fill="#f0edf6" font-weight="600" letter-spacing="1.5">COMPARE</text><rect x="430" y="180" width="340" height="230" rx="16" fill="#32313f" stroke="#484556"/><text x="450" y="215" font-size="13" fill="#b8a2f5" font-weight="600" >02</text><text x="485" y="215" font-size="13" fill="#f0edf6" font-weight="600" letter-spacing="1.5">INTERVENE</text><rect x="818" y="180" width="340" height="230" rx="16" fill="#32313f" stroke="#484556"/><text x="838" y="215" font-size="13" fill="#b8a2f5" font-weight="600" >03</text><text x="873" y="215" font-size="13" fill="#f0edf6" font-weight="600" letter-spacing="1.5">MEASURE</text><text x="65" y="269" font-size="14" fill="#c7b2ff" font-weight="600" >A</text><text x="91" y="269" font-size="18" fill="#eceaf1" font-weight="400" >The house was</text><rect x="231" y="247" width="61" height="32" rx="7" fill="#4b415f"/><text x="242" y="269" font-size="18" fill="#c7b2ff" font-weight="600" >big</text><text x="65" y="315" font-size="14" fill="#9ecce4" font-weight="600" >B</text><text x="91" y="315" font-size="18" fill="#eceaf1" font-weight="400" >The house was</text><rect x="231" y="293" width="61" height="32" rx="7" fill="#4b415f"/><text x="242" y="315" font-size="18" fill="#9ecce4" font-weight="600" >in</text><text x="64" y="374" font-size="14" fill="#bbb7cb" font-weight="400" >Choose two different token sequences.</text><text x="452" y="251" font-size="15" fill="#c7b2ff" font-weight="500" >A states</text><text x="672" y="251" font-size="15" fill="#9ecce4" font-weight="500" >B states</text><path d="M471 284 C524 258 569 311 625 282 S698 272 725 284" fill="none" stroke="#b8a2f5" stroke-width="3"/><circle cx="471" cy="284" r="7" fill="#c7b2ff"/><circle cx="600" cy="289" r="8" fill="#f3dbac"/><circle cx="725" cy="284" r="7" fill="#9ecce4"/><text x="464" y="321" font-size="13" fill="#c5c2d2" font-weight="400" >t = 0</text><text x="580" y="329" font-size="16" fill="#f3dbac" font-weight="600" >t</text><text x="686" y="321" font-size="13" fill="#c5c2d2" font-weight="400" >t = 1</text><text x="452" y="374" font-size="14" fill="#bbb7cb" font-weight="400" >Patch at a chosen layer; continue forward.</text><text x="840" y="263" font-size="29" fill="#c7b2ff" font-weight="600" >c(t)</text><text x="909" y="263" font-size="19" fill="#f1eef8" font-weight="500" >Path progress</text><text x="840" y="309" font-size="29" fill="#9ecce4" font-weight="600" >d(t)</text><text x="909" y="309" font-size="19" fill="#f1eef8" font-weight="500" >Endpoint distance</text><text x="840" y="374" font-size="14" fill="#bbb7cb" font-weight="400" >Read residuals + logits at the final token.</text><text x="390" y="303" font-size="28" fill="#a39bb7" font-weight="400" >→</text><text x="778" y="303" font-size="28" fill="#a39bb7" font-weight="400" >→</text><text x="42" y="447" font-size="12" fill="#d4c1fc" font-weight="600" letter-spacing="1">LOCAL INFERENCE</text><text x="220" y="447" font-size="14" fill="#bdb8cb" font-weight="400" >GPT-2 · Pythia · Qwen</text><text x="818" y="447" font-size="12" fill="#a7a1b8" font-weight="400" >Workflow illustration · not a measured trajectory</text></g></svg>
